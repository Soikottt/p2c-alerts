name: Alert Engine Cron

on:
  schedule:
    - cron: "*/5 * * * *" # Runs every 5 minutes
  workflow_dispatch:      # Allows you to run it manually from GitHub

jobs:
  run-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Requirements
        run: pip install -r requirements.txt

      - name: Run Alert Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RINGBA_API_TOKEN: ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID: ${{ secrets.RINGBA_ACCOUNT_ID }}
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: 587
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DRY_RUN: "false"
        run: python alert_engine.py
