name: Load history from Ringba (run by hand)

on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days of history to load"
        default: "90"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-engine.txt
      - run: pip install -r requirements-engine.txt
      - name: Create / upgrade database tables
        run: python setup_db.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Load history
        run: python backfill.py ${{ github.event.inputs.days }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RINGBA_API_TOKEN: ${{ secrets.RINGBA_API_TOKEN }}
          RINGBA_ACCOUNT_ID: ${{ secrets.RINGBA_ACCOUNT_ID }}
